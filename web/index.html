<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101d24">
  <title>Офисный Гвинт — игровая</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101d24'/%3E%3Ctext x='5' y='24' font-size='24'%3E☕%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css?v=iphone-fallback-1"><script src="/sounds.js" defer></script><script src="/animations.js" defer></script><script src="/app.js?v=iphone-fallback-1" defer></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="/" aria-label="Офисный Гвинт"><span class="brand-icon">☕</span><span>ОФИСНЫЙ <strong>ГВИНТ</strong></span></a><div class="top-meta"><button id="sound-toggle" class="ghost sound-toggle" type="button" aria-label="Выключить звук" title="Выключить звук">🔊</button><span id="connection">Подключение…</span><span class="avatar" id="avatar">ОГ</span></div></header>
  <main id="app"><section class="loading"><div class="loader"></div><p>Открываем игровую…</p></section></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="confirm"><form method="dialog"><h2>Завершить партию?</h2><p>Сопернику будет засчитана победа.</p><div class="dialog-buttons"><button value="cancel" class="secondary">Продолжить игру</button><button value="concede" class="danger">Сдаться</button></div></form></dialog>
  <dialog id="cardinfo"><div class="card-info" id="cardinfo-body"></div><form method="dialog"><button class="secondary" value="close">Закрыть</button></form></dialog>
  <footer>Офисные будни. Неофисные решения.</footer>
</body>
</html>
